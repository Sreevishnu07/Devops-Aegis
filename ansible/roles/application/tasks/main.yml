---
- name: Installing python runtime deps
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Creating app group
  ansible.builtin.group:
   name: "{{ app_group }}"
   system: true
   state: present

- name: Creating an user for app purposes
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    create_home: false
    shell: /usr/bin/nologin
    state: present

- name: Creating app release dir
  ansible.builtin.file:
    path: "{{ app_release_path }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    state: directory
    mode: "0755"

- name: Copy Flask application package from controller
  ansible.builtin.copy:
    src: "{{ app_source_dir }}/sentinel_app/"
    dest: "{{ app_release_path }}/sentinel_app/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: preserve
    directory_mode: "0755"
  notify: Restart Sentinel application

- name: Copy production requirements from controller
  ansible.builtin.copy:
    src: "{{ app_source_dir }}/requirements.txt"
    dest: "{{ app_release_path }}/requirements.txt"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  notify: Restart Sentinel application

- name: Create release-specific Python virtual environment
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ app_release_path }}/venv"
    creates: "{{ app_release_path }}/venv/bin/python"

- name: Install application dependencies into release virtual environment
  ansible.builtin.pip:
    requirements: "{{ app_release_path }}/requirements.txt"
    executable: "{{ app_release_path }}/venv/bin/pip"
    state: present
  notify: Restart Sentinel application

- name: Point current symlink to requested release
  ansible.builtin.file:
    src: "{{ app_release_path }}"
    dest: "{{ app_current_path }}"
    state: link
    force: true
  notify: Restart Sentinel application

- name: Install systemd unit for the Flask application
  ansible.builtin.template:
    src: sentinel-app.service.j2
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Sentinel application

- name: Enable and start Sentinel application
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    daemon_reload: true
    enabled: true
    state: started

- name: Restart application after release switch or unit update
  ansible.builtin.meta: flush_handlers

- name: Wait for local application health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    method: GET
    status_code: 200
    return_content: true
  register: app_health
  retries: 10
  delay: 3
  until: app_health.status == 200

- name: Verify application identity and release
  ansible.builtin.assert:
    that:
      - app_health.json.status == "healthy"
      - app_health.json.environment == app_environment
      - app_health.json.version == app_version
    fail_msg: "Application health response did not match the requested environment or release."
    success_msg: "{{ app_environment }} is healthy on release {{ app_version }}."

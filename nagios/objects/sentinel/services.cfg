# Sentinel service objects.

define service {
    name                    sentinel-service
    use                     generic-service
    check_period            24x7
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    notification_period     24x7
    notification_interval   15
    notification_options    w,u,c,r
    contact_groups          sentinel-admins
    register                0
}

# Operations node checks.
define service {
    use                     sentinel-service
    host_name               sentinel-ops
    service_description     Nginx Health Endpoint
    check_command           sentinel-check-local-http!80!/nginx-health
}

define service {
    use                     sentinel-service
    host_name               sentinel-ops
    service_description     Active Application Through Nginx
    check_command           sentinel-check-local-http!80!/health
}

# Direct application checks. Only these health services can trigger application
# failover. The handler itself verifies that the failed node is currently active.
define service {
    use                     sentinel-service
    host_name               sentinel-blue
    service_description     SENTINEL-APP-HEALTH
    check_command           sentinel-check-nrpe!check_sentinel_app
    event_handler           sentinel-recover-service
    event_handler_enabled   1
}

define service {
    use                     sentinel-service
    host_name               sentinel-blue
    service_description     Gunicorn Process
    check_command           sentinel-check-nrpe!check_sentinel_gunicorn
}

define service {
    use                     sentinel-service
    host_name               sentinel-blue
    service_description     CPU Load
    check_command           sentinel-check-nrpe!check_sentinel_load
}

define service {
    use                     sentinel-service
    host_name               sentinel-blue
    service_description     Root Filesystem
    check_command           sentinel-check-nrpe!check_sentinel_disk
}

# Green has the same checks. A standby failure is reported, but the event
# handler will not switch traffic unless Green is actually the active node.
define service {
    use                     sentinel-service
    host_name               sentinel-green
    service_description     SENTINEL-APP-HEALTH
    check_command           sentinel-check-nrpe!check_sentinel_app
    event_handler           sentinel-recover-service
    event_handler_enabled   1
}

define service {
    use                     sentinel-service
    host_name               sentinel-green
    service_description     Gunicorn Process
    check_command           sentinel-check-nrpe!check_sentinel_gunicorn
}

define service {
    use                     sentinel-service
    host_name               sentinel-green
    service_description     CPU Load
    check_command           sentinel-check-nrpe!check_sentinel_load
}

define service {
    use                     sentinel-service
    host_name               sentinel-green
    service_description     Root Filesystem
    check_command           sentinel-check-nrpe!check_sentinel_disk
}

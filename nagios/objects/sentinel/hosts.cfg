# Sentinel host objects. Application hosts are checked through NRPE rather than
# ICMP because the current Security Groups intentionally do not allow ICMP.

define host {
    name                    sentinel-linux-host
    use                     generic-host
    check_period            24x7
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    notification_period     24x7
    notification_interval   15
    notification_options    d,u,r
    contact_groups          sentinel-admins
    register                0
}

define host {
    use                     sentinel-linux-host
    host_name               sentinel-ops
    alias                   Sentinel Operations Node
    address                 127.0.0.1
    check_command           check-host-alive
}

define host {
    use                     sentinel-linux-host
    host_name               sentinel-blue
    alias                   Sentinel Blue Application Node
    address                 10.20.1.222
    check_command           sentinel-check-nrpe-agent
    event_handler           sentinel-recover-host
    event_handler_enabled   1
}

define host {
    use                     sentinel-linux-host
    host_name               sentinel-green
    alias                   Sentinel Green Application Node
    address                 10.20.2.253
    check_command           sentinel-check-nrpe-agent
    event_handler           sentinel-recover-host
    event_handler_enabled   1
}

define hostgroup {
    hostgroup_name  sentinel-operations
    alias           Sentinel Operations
    members         sentinel-ops
}

define hostgroup {
    hostgroup_name  sentinel-application-nodes
    alias           Sentinel Application Nodes
    members         sentinel-blue,sentinel-green
}

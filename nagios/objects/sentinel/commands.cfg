# Sentinel Nagios commands.
# Nagios Core plugin directory is normally /usr/local/nagios/libexec.
# Ubuntu's packaged check_nrpe client is normally /usr/lib/nagios/plugins/check_nrpe.

define command {
    command_name    sentinel-check-nrpe-agent
    command_line    /usr/lib/nagios/plugins/check_nrpe -H $HOSTADDRESS$ -t 10
}

define command {
    command_name    sentinel-check-nrpe
    command_line    /usr/lib/nagios/plugins/check_nrpe -H $HOSTADDRESS$ -c $ARG1$ -t 10
}

define command {
    command_name    sentinel-check-local-http
    command_line    $USER1$/check_http -H 127.0.0.1 -p $ARG1$ -u $ARG2$ -t 10
}

define command {
    command_name    sentinel-recover-service
    command_line    /usr/bin/sudo -n /usr/local/sbin/sentinel-recover service "$HOSTNAME$" "$SERVICESTATE$" "$SERVICESTATETYPE$" "$SERVICEATTEMPT$"
}

define command {
    command_name    sentinel-recover-host
    command_line    /usr/bin/sudo -n /usr/local/sbin/sentinel-recover host "$HOSTNAME$" "$HOSTSTATE$" "$HOSTSTATETYPE$" "$HOSTATTEMPT$"
}

define command {
    command_name    sentinel-notify-service-by-email
    command_line    /usr/bin/printf "%b" "***** Sentinel Nagios *****\n\nNotification Type: $NOTIFICATIONTYPE$\n\nHost: $HOSTNAME$\nService: $SERVICEDESC$\nAddress: $HOSTADDRESS$\nState: $SERVICESTATE$\n\nDate/Time: $LONGDATETIME$\n\nOutput:\n$SERVICEOUTPUT$\n\nAdditional Output:\n$LONGSERVICEOUTPUT$\n" | /usr/bin/mail -r sreevishnu0407@gmail.com -s "[Sentinel][$NOTIFICATIONTYPE$] $HOSTNAME$ / $SERVICEDESC$ is $SERVICESTATE$" sreevishnu0407@gmail.com
}

define command {
    command_name    sentinel-notify-host-by-email
    command_line    /usr/bin/printf "%b" "***** Sentinel Nagios *****\n\nNotification Type: $NOTIFICATIONTYPE$\n\nHost: $HOSTNAME$\nAlias: $HOSTALIAS$\nAddress: $HOSTADDRESS$\nState: $HOSTSTATE$\n\nDate/Time: $LONGDATETIME$\n\nOutput:\n$HOSTOUTPUT$\n" | /usr/bin/mail -r sreevishnu0407@gmail.com -s "[Sentinel][$NOTIFICATIONTYPE$] Host $HOSTNAME$ is $HOSTSTATE$" sreevishnu0407@gmail.com
}
